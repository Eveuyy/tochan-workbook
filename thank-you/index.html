<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>תודה שרכשת! | יצירת תוכן עם איב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
  background: #0F0608;
  color: #FFF1E8;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  overflow: hidden;
}
.aurora { position: fixed; inset: -20vmax; pointer-events: none; filter: blur(80px); opacity: .42; }
.aurora i { position: absolute; border-radius: 50%; }
.aurora i:nth-child(1) { width: 46vmax; height: 46vmax; left: 8%; top: 10%; background: radial-gradient(circle, #FF6A3D, transparent 65%); opacity: .55; }
.aurora i:nth-child(2) { width: 42vmax; height: 42vmax; right: 8%; top: 38%; background: radial-gradient(circle, #FF2E88, transparent 65%); opacity: .45; }
.card {
  position: relative;
  max-width: 520px;
  width: 100%;
  padding: 44px 28px 40px;
  background: rgba(28, 13, 17, .82);
  border: 1px solid rgba(255, 226, 210, .13);
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  margin-bottom: 28px;
  border-radius: 16px;
  background: #2A0E16;
  color: #fff;
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
}
.logo span { color: #FF6A3D; }
.check {
  width: 76px;
  height: 76px;
  margin: 0 auto 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(100deg, #FF2E88 0%, #FF6A3D 45%, #FFC23D 90%);
  box-shadow: 0 0 40px rgba(255, 106, 61, .6);
  color: #fff;
  font-size: 38px;
  font-weight: 800;
}
h1 {
  margin-bottom: 14px;
  font-size: clamp(30px, 6vw, 42px);
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -.02em;
}
h1 .lit {
  background: linear-gradient(100deg, #FF2E88 0%, #FF6A3D 45%, #FFC23D 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
p { font-size: 18px; line-height: 1.6; color: #D2A797; margin-bottom: 10px; }
p.sub { color: #FFF1E8; font-weight: 500; }
p:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i></div>
  <main class="card">
    <div class="logo" dir="ltr" aria-hidden="true">e<span>.</span></div>
    <div class="check" aria-hidden="true">✓</div>
    <h1><span class="lit">תודה שרכשת!</span> 🎉</h1>
    <p class="sub">הרכישה שלך התקבלה בהצלחה.</p>
    <p>פרטי הגישה לקורס בדרך למייל שלך. כדאי לבדוק גם בספאם ובקידומי מכירות, ליתר ביטחון.</p>
  </main>
