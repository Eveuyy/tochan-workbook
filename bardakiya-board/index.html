:root {
  --cream: #FFFBF0; --paper: #FFFFFF; --ink: #5C4A63; --ink-soft: #7d6c84; --line: #e8e0d6;
  --orange: #F6B44C; --peach: #F7A892; --blue: #B1E7EA; --green: #CAEEC9;
  --peach-t: #fde6df; --blue-t: #e2f6f7; --green-t: #e8f7e8; --orange-t: #fdeccc;
  --display: Pashut, "Birzia", "Arial Hebrew", sans-serif;
  --body: Birzia, "Arial Hebrew", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--cream); color: var(--ink); font-family: var(--body); font-weight: 500; margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1440px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

a.back { display: inline-block; font-weight: 700; color: inherit; text-underline-offset: 3px; padding: 6px 0 10px; min-height: 44px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: normal; font-size: clamp(30px, 4vw, 44px); margin: 0; text-wrap: balance; }
.brand .sub { font-size: 15px; color: var(--ink-soft); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 8px 18px 10px; font-weight: 700; font-size: 15px; }
a.btn { text-decoration: none; display: inline-block; color: var(--ink); }
a.btn.primary { color: var(--cream); }
.btn.primary { background: var(--ink); color: var(--cream); }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 4px; padding-inline: 8px; }
.btn:disabled { opacity: .45; cursor: default; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin: 22px 0 14px; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav .range { font-family: var(--display); font-size: 26px; margin-inline: 10px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px 5px; font-size: 13px; font-weight: 700; border: 1.5px solid transparent; }
.legend .chip { cursor: pointer; background: var(--paper); border-color: var(--line); }
.legend .chip[aria-pressed="false"] { opacity: .4; }
.hist { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.hist h2 { margin: 0 0 4px; font-size: 18px; }
.hist .post { max-width: 640px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

.notice { font-size: 14px; background: var(--paper); border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { background: var(--paper); border-radius: 18px; border: 1.5px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; min-width: 0; }
.day.today { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange) inset; }
.day.past { opacity: .72; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 6px; border-bottom: 1.5px solid var(--line); }
.dayhead b { font-size: 16px; font-weight: 900; }
.dayhead span { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.empty { font-size: 13px; color: var(--ink-soft); padding: 6px 4px; }
.add-day { margin-top: auto; border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.add-day:hover { border-color: var(--ink-soft); color: var(--ink); }

.post { text-align: right; border: 0; border-radius: 14px; padding: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--tint); width: 100%; min-width: 0; }
.post:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(92,74,99,.15); }
.post .thumb { aspect-ratio: 4 / 5; width: 100%; object-fit: cover; display: block; max-width: 100%; }
.post .pbody { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.post .meta { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.post .title { font-size: 15px; font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
.status { align-self: flex-start; font-size: 12px; font-weight: 900; border-radius: 999px; padding: 2px 10px 4px; background: var(--paper); border: 1.5px solid var(--ink); }
.status[data-s="רעיון"] { border-style: dashed; border-color: var(--ink-soft); color: var(--ink-soft); }
.status[data-s="בהכנה"] { border-color: var(--ink-soft); }
.status[data-s="מחכה לאישור"] { background: var(--orange); border-color: var(--orange); }
.status[data-s="מאושר"] { background: var(--green); border-color: #8fd18d; }
.status[data-s="פורסם"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.status[data-s="נדחה"] { text-decoration: line-through; border-color: var(--ink-soft); color: var(--ink-soft); opacity: .8; }

/* חלון פרטים ועריכה */
.overlay { position: fixed; inset: 0; background: rgba(92,74,99,.4); display: flex; justify-content: flex-start; z-index: 20; }
.panel { background: var(--cream); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; box-shadow: 0 0 40px rgba(92,74,99,.25); }
.panel h2 { font-family: var(--display); font-weight: normal; font-size: 30px; margin: 4px 0 14px; text-wrap: balance; }
.panel .close { float: left; }
.gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.gallery img { height: 220px; border-radius: 12px; flex: none; max-width: 100%; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 900; }
.field input, .field select, .field textarea { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 15px; width: 100%; }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.caption { white-space: pre-wrap; background: var(--paper); border-radius: 12px; padding: 12px 14px; line-height: 1.55; font-size: 15px; border: 1.5px solid var(--line); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; margin-bottom: 14px; }
.kv dt { font-weight: 900; }
.kv dd { margin: 0; }
.panel .foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.confirm { background: var(--peach-t); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.err { color: #9b3b2a; font-size: 14px; font-weight: 700; }
.small { font-size: 13px; color: var(--ink-soft); }

@media (max-width: 900px) {
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
  .day .posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .post:hover { transform: none; } }
</style>
</head>

      <button class="btn" id="prevW" type="button" aria-label="שבוע קודם">→</button>
      <span class="range" id="range"></span>
      <button class="btn" id="nextW" type="button" aria-label="שבוע הבא">←</button>
      <button class="btn ghost" id="todayW" type="button">מהיום</button>
    </div>
    <div class="legend" id="legend" aria-label="סינון לפי סוג תוכן"></div>
    <button class="btn ghost" id="histBtn" type="button" aria-pressed="false">🗂 היסטוריה</button>
  </div>

  <div class="notice" id="notice" hidden></div>
  <main class="week" id="week" aria-live="polite"></main>
  <section class="hist" id="hist" hidden></section>
</div>

<div class="overlay" id="overlay" dir="rtl" lang="he" hidden></div>

<script>
document.documentElement.setAttribute("dir", "rtl"); document.documentElement.setAttribute("lang", "he");
const PILLARS = [
  { name: "השבוע בברדקיה", color: "var(--green)", tint: "var(--green-t)" },
  { name: "טיפים להורים", color: "var(--blue)", tint: "var(--blue-t)" },
  { name: "שבירת התנגדויות", color: "var(--peach)", tint: "var(--peach-t)" },
  { name: "מוצר", color: "var(--orange)", tint: "var(--orange-t)" },
  { name: "קהילה והומור", color: "var(--peach)", tint: "#fff1e4" },
  { name: "אווירה", color: "var(--ink-soft)", tint: "#f1ecf2" },
];
const FORMATS = ["קרוסלה", "פוסט", "רילס", "סטורי"];
const STATUSES = ["רעיון", "בהכנה", "מחכה לאישור", "מאושר", "פורסם", "נדחה"];
const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

let posts = [];
let db = null, assets = null, userCap = null, canWrite = false, myId = null;
const hidden = new Set();
const CLOSED = ["פורסם", "נדחה"]; // מה שפורסם או נדחה עובר להיסטוריה ולא מופיע בלוח השבועי
let showHist = false;
let weekStart = startOfWeek(new Date());

function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function short(d) { return d.getDate() + "." + (d.getMonth() + 1); }
function pillar(name) { return PILLARS.find(p => p.name === name) || PILLARS[PILLARS.length - 1]; }
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function renderLegend() {
  const box = document.getElementById("legend"); box.textContent = "";
  for (const p of PILLARS) {
    const b = el("button", { class: "chip", type: "button", "aria-pressed": String(!hidden.has(p.name)), onclick: () => { hidden.has(p.name) ? hidden.delete(p.name) : hidden.add(p.name); render(); } },
      el("span", { class: "dot", style: "background:" + p.color }), p.name);
    box.append(b);
  }
}

function render() {
  renderLegend();
  const end = addDays(weekStart, 13);
  document.getElementById("range").textContent = short(weekStart) + "–" + short(end);
  const today = iso(new Date());
  const week = document.getElementById("week"); week.textContent = "";
  for (let i = 0; i < 14; i++) {
    const d = addDays(weekStart, i), key = iso(d);
    const dayPosts = posts.filter(p => p.date === key && !hidden.has(p.pillar) && !CLOSED.includes(p.status)).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    const col = el("section", { class: "day" + (key === today ? " today" : "") + (key < today ? " past" : ""), "aria-label": DAYS[i % 7] + " " + short(d) },
      el("div", { class: "dayhead" }, el("b", { text: DAYS[i % 7] }), el("span", { text: short(d) })));
    const list = el("div", { class: "posts" });
    if (!dayPosts.length) list.append(el("div", { class: "empty", text: "אין פוסטים" }));
    for (const p of dayPosts) list.append(card(p));
    col.append(list);
    if (canWrite) col.append(el("button", { class: "add-day", type: "button", onclick: () => openEdit({ date: key }) , text: "+ הוספה" }));
    week.append(col);
  }
  renderHist();
}

function renderHist() {
  const done = posts.filter(p => CLOSED.includes(p.status)).sort((a, b) => ((b.date || "") + (b.time || "")).localeCompare((a.date || "") + (a.time || "")));
  const btn = document.getElementById("histBtn"), box = document.getElementById("hist");
  btn.textContent = "🗂 היסטוריה (" + done.length + ")"; btn.setAttribute("aria-pressed", String(showHist));
  box.hidden = !showHist; box.textContent = "";
  if (!showHist) return;
  box.append(el("h2", { text: "היסטוריה: מה שפורסם או נדחה" }));
  if (!done.length) box.append(el("div", { class: "empty", text: "עוד אין כאן כלום" }));
  for (const p of done) box.append(card(p, true));
}

function card(p, withDate) {
  const pl = pillar(p.pillar);
  const b = el("button", { class: "post", type: "button", style: "--tint:" + pl.tint, onclick: () => openView(p.id) });
  if (p.images && p.images[0]) b.append(el("img", { class: "thumb", src: p.images[0], alt: "", loading: "lazy" }));
  b.append(el("div", { class: "pbody" },
    el("div", { class: "meta" }, el("span", { text: (withDate && p.date ? short(new Date(p.date + "T12:00")) + " · " : "") + (p.time || "") }), el("span", { text: p.format || "" })),
    el("div", { class: "title", text: p.title || "בלי כותרת" }),
    el("span", { class: "status", "data-s": p.status || "רעיון", text: p.status || "רעיון" })));
  return b;
}

document.getElementById("histBtn").addEventListener("click", () => { showHist = !showHist; renderHist(); if (showHist) document.getElementById("hist").scrollIntoView({ behavior: "smooth" }); });

const overlay = document.getElementById("overlay");
function closePanel() { overlay.hidden = true; overlay.textContent = ""; }
overlay.addEventListener("click", e => { if (e.target === overlay) closePanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closePanel(); });

function openView(id) {
  const p = posts.find(x => x.id === id); if (!p) return;
  const pl = pillar(p.pillar);
  const panel = el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": p.title || "פוסט" },
    el("button", { class: "btn close", type: "button", onclick: closePanel, text: "סגירה" }),
    el("span", { class: "chip", style: "background:" + pl.tint }, el("span", { class: "dot", style: "background:" + pl.color }), p.pillar || "אווירה"),
    el("h2", { text: p.title || "בלי כותרת" }));
  if (editorKey && p.row) {
    const tools = el("div", { class: "foot" });
    const msg = el("div", { class: "small", role: "status" });
    if (p.status !== "מאושר") tools.append(el("button", { class: "btn primary", type: "button", text: "✅ מאשרת", onclick: () => quickStatus(p, "מאושר", msg) }));
    tools.append(el("button", { class: "btn", type: "button", text: "✏️ עריכה", onclick: () => openEditor(p) }));
    tools.append(el("button", { class: "btn", type: "button", text: "💬 הערה ל-Claude", onclick: () => openComment(p) }));
    if (p.status !== "נדחה") tools.append(el("button", { class: "btn ghost", type: "button", text: "לדחות", onclick: () => quickStatus(p, "נדחה", msg) }));
    panel.append(tools, msg);
  }
  if (p.images && p.images.length) { const g = el("div", { class: "gallery" }); p.images.forEach(src => g.append(el("img", { src, alt: "" }))); panel.append(g); }
  const d = p.date ? new Date(p.date + "T12:00") : null;
  panel.append(el("dl", { class: "kv" },
    el("dt", { text: "מתי" }), el("dd", { text: d ? DAYS[d.getDay()] + " " + short(d) + (p.time ? ", " + p.time : "") : "עוד לא נקבע" }),
    el("dt", { text: "פורמט" }), el("dd", { text: p.format || "" }),
    el("dt", { text: "סטטוס" }), el("dd", {}, el("span", { class: "status", "data-s": p.status || "רעיון", text: p.status || "רעיון" }))));
  if (p.caption) panel.append(el("div", { class: "field" }, el("label", { text: "כיתוב" }), el("div", { class: "caption", text: p.caption })));
  if (p.notes) panel.append(el("div", { class: "field" }, el("label", { text: "הערות" }), el("div", { class: "caption", text: p.notes })));
  const by = el("div", { class: "small" }); panel.append(by);
  if (p.createdBy && userCap && userCap.profiles) userCap.profiles([p.createdBy]).then(ps => { const n = (ps && ps[p.createdBy] && ps[p.createdBy].name) || ""; if (n) by.textContent = "נוסף על ידי " + n; }).catch(() => {});
  if (canWrite) {
    const foot = el("div", { class: "foot" });
    if (p.status === "מחכה לאישור") foot.append(el("button", { class: "btn primary", type: "button", text: "מאשרת ✓", onclick: () => save({ ...p, status: "מאושר" }, foot) }));
    foot.append(el("button", { class: "btn", type: "button", text: "עריכה", onclick: () => openEdit(p) }));
    foot.append(el("button", { class: "btn ghost", type: "button", text: "מחיקה", onclick: () => askDelete(p, foot) }));
    panel.append(foot);
  }
  overlay.textContent = ""; overlay.append(panel); overlay.hidden = false; panel.querySelector(".close").focus();
}

function askDelete(p, foot) {
  if (foot.querySelector(".confirm")) return;
  const c = el("div", { class: "confirm" }, "למחוק את הפוסט מהלוח?",
    el("button", { class: "btn", type: "button", text: "כן, למחוק", onclick: async () => { try { await db.doc("posts/" + p.id).delete(); closePanel(); } catch (e) { c.append(el("span", { class: "err", text: "המחיקה לא הצליחה: אין הרשאה או שאין חיבור." })); } } }),
    el("button", { class: "btn ghost", type: "button", text: "ביטול", onclick: () => c.remove() }));
  foot.append(c);
}

function openEdit(p) {
  const isNew = !p.id;
  const f = { title: p.title || "", date: p.date || iso(new Date()), time: p.time || "20:00", format: p.format || "קרוסלה", pillar: p.pillar || "טיפים להורים", status: p.status || "רעיון", caption: p.caption || "", notes: p.notes || "", images: (p.images || []).slice() };
  const sel = (id, opts, val) => { const s = el("select", { id }); opts.forEach(o => s.append(el("option", { value: o, text: o, selected: o === val ? "selected" : false }))); return s; };
  const imgs = el("div", { class: "gallery" });
  const drawImgs = () => { imgs.textContent = ""; f.images.forEach((src, i) => imgs.append(el("div", {}, el("img", { src, alt: "" }), el("button", { class: "btn ghost", type: "button", text: "הסרה", onclick: () => { f.images.splice(i, 1); drawImgs(); } })))); };
  drawImgs();
  const err = el("div", { class: "err", role: "alert" });
  const panel = el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": isNew ? "פוסט חדש" : "עריכת פוסט" },
    el("button", { class: "btn close", type: "button", onclick: closePanel, text: "סגירה" }),
    el("h2", { text: isNew ? "פוסט חדש" : "עריכת פוסט" }),
    el("div", { class: "field" }, el("label", { for: "f-title", text: "כותרת" }), el("input", { id: "f-title", value: f.title, placeholder: "למשל: הידעת? גרביים בלבד" })),
    el("div", { class: "row2" },
      el("div", { class: "field" }, el("label", { for: "f-date", text: "תאריך" }), el("input", { id: "f-date", type: "date", value: f.date })),
      el("div", { class: "field" }, el("label", { for: "f-time", text: "שעה" }), el("input", { id: "f-time", type: "time", value: f.time }))),
    el("div", { class: "row2" },
      el("div", { class: "field" }, el("label", { for: "f-pillar", text: "סוג תוכן" }), sel("f-pillar", PILLARS.map(x => x.name), f.pillar)),
      el("div", { class: "field" }, el("label", { for: "f-format", text: "פורמט" }), sel("f-format", FORMATS, f.format))),
    el("div", { class: "field" }, el("label", { for: "f-status", text: "סטטוס" }), sel("f-status", STATUSES, f.status)),
    el("div", { class: "field" }, el("label", { for: "f-caption", text: "כיתוב" }), el("textarea", { id: "f-caption" }, f.caption)),
    el("div", { class: "field" }, el("label", { for: "f-notes", text: "הערות" }), el("textarea", { id: "f-notes", style: "min-height:80px" }, f.notes)),
    el("div", { class: "field" }, el("label", { text: "תמונות" }), imgs));
  if (assets) {
    const up = el("input", { id: "f-upload", type: "file", accept: "image/*", multiple: "multiple" });
    up.addEventListener("change", async () => {
      for (const file of up.files) { try { const r = await assets.upload(file); f.images.push(r.url); drawImgs(); } catch (e) { err.textContent = "העלאת התמונה לא הצליחה. נסו תמונה קטנה יותר."; } }
      up.value = "";
    });
    panel.append(el("div", { class: "field" }, el("label", { for: "f-upload", text: "הוספת תמונות" }), up));
  }
  const foot = el("div", { class: "foot" },
    el("button", { class: "btn primary", type: "button", text: isNew ? "הוספה ללוח" : "שמירה", onclick: () => {
      const g = id => panel.querySelector("#" + id).value;
      const data = { ...p, title: g("f-title").trim(), date: g("f-date"), time: g("f-time"), pillar: g("f-pillar"), format: g("f-format"), status: g("f-status"), caption: g("f-caption"), notes: g("f-notes"), images: f.images };
      if (!data.title) { err.textContent = "חסרה כותרת לפוסט."; return; }
      if (!data.date) { err.textContent = "חסר תאריך."; return; }
      save(data, foot, err);
    } }),
    el("button", { class: "btn ghost", type: "button", text: "ביטול", onclick: () => (isNew ? closePanel() : openView(p.id)) }), err);
  panel.append(foot);
  overlay.textContent = ""; overlay.append(panel); overlay.hidden = false; panel.querySelector("#f-title").focus();
}

async function save(data, foot, err) {
  const { id, ...rest } = data;
  rest.updatedAt = new Date().toISOString();
  try {
    if (id) { await db.doc("posts/" + id).set(rest); openView(id); }
    else { rest.createdBy = myId || null; const ref = await db.collection("posts").add(rest); posts.push({ id: ref.id, ...rest }); render(); openView(ref.id); }
  } catch (e) {
    const m = (e && e.code === "invalid_argument") ? "אין לך הרשאה לשנות את הלוח. אפשר לבקש מאיב גישת עריכה." : "השמירה לא הצליחה. בדקו את החיבור ונסו שוב.";
    if (err) err.textContent = m; else foot.append(el("span", { class: "err", text: m }));
  }
}

document.getElementById("prevW").onclick = () => { weekStart = addDays(weekStart, -7); render(); };
document.getElementById("nextW").onclick = () => { weekStart = addDays(weekStart, 7); render(); };
document.getElementById("todayW").onclick = () => { weekStart = startOfWeek(new Date()); render(); };

render();

// ---------- מצב עריכה לאיב (20.10.2026) ----------
// הכניסה דרך קישור אישי שבוט המשרד שולח לאיב ("כניסה ללוח"). המפתח נשמר רק בדפדפן שלה.
const API = "https://bardakiya-board-api.coheneve95.workers.dev";
let editorKey = null;
try { editorKey = localStorage.getItem("bardakiyaBoardKey"); } catch (e) {}
(function takeKeyFromLink() {
  const m = /[#&]k=([a-f0-9]{20,})/.exec(location.hash);
  if (!m) return;
  editorKey = m[1];
  try { localStorage.setItem("bardakiyaBoardKey", editorKey); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
})();
async function api(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json", "X-Board-Key": editorKey }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { editorKey = null; try { localStorage.removeItem("bardakiyaBoardKey"); } catch (e) {} setEditorUi(); }
  if (!j.ok) throw new Error(j.error || "failed");
  return j;
}
function setEditorUi() {
  document.getElementById("commentBtn").hidden = !editorKey;
  document.getElementById("editorBadge").hidden = !editorKey;
}
async function quickStatus(p, status, msg) {
  msg.textContent = "שומרת…";
  try { await api("/api/update", { id: p.id, changes: { status } }); msg.textContent = "✓ נשמר"; await loadSheet(); openView(p.id); }
  catch (e) { msg.textContent = e.message === "auth" ? "הכניסה פגה. בקשי מהבוט קישור חדש (\u201cכניסה ללוח\u201d)." : "השמירה לא הצליחה. נסי שוב בעוד רגע."; }
}
function openEditor(p) {
  const err = el("div", { class: "err", role: "alert" });
  const sel = el("select", { id: "e-status" }); STATUSES.forEach(o => sel.append(el("option", { value: o, text: o, selected: o === p.status ? "selected" : false })));
  const panel = el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "עריכת פוסט" },
    el("button", { class: "btn close", type: "button", onclick: () => openView(p.id), text: "חזרה" }),
    el("h2", { text: "עריכת פוסט" }),
    el("div", { class: "field" }, el("label", { for: "e-title", text: "כותרת" }), el("input", { id: "e-title", value: p.title || "" })),
    el("div", { class: "row2" },
      el("div", { class: "field" }, el("label", { for: "e-date", text: "תאריך" }), el("input", { id: "e-date", type: "date", value: p.date || "" })),
      el("div", { class: "field" }, el("label", { for: "e-time", text: "שעה" }), el("input", { id: "e-time", type: "time", value: p.time || "" }))),
    el("div", { class: "field" }, el("label", { for: "e-status", text: "סטטוס" }), sel),
    el("div", { class: "field" }, el("label", { for: "e-caption", text: "כיתוב" }), el("textarea", { id: "e-caption" }, p.caption || "")));
  const save = el("button", { class: "btn primary", type: "button", text: "שמירה", onclick: async () => {
    const g = id => panel.querySelector("#" + id).value;
    const ch = {};
    if (g("e-title").trim() !== (p.title || "")) ch.title = g("e-title").trim();
    if (g("e-date") && g("e-date") !== p.date) ch.date = g("e-date");
    if (g("e-time") && g("e-time") !== p.time) ch.time = g("e-time");
    if (g("e-status") !== p.status) ch.status = g("e-status");
    if (g("e-caption") !== (p.caption || "")) ch.caption = g("e-caption");
    if (!Object.keys(ch).length) { openView(p.id); return; }
    save.disabled = true; err.textContent = "שומרת…";
    try { await api("/api/update", { id: p.id, changes: ch }); await loadSheet(); openView(p.id); }
    catch (e) { save.disabled = false; err.textContent = e.message === "auth" ? "הכניסה פגה. בקשי מהבוט קישור חדש (\u201cכניסה ללוח\u201d)." : "השמירה לא הצליחה. נסי שוב בעוד רגע."; }
  } });
  panel.append(el("div", { class: "foot" }, save, el("button", { class: "btn ghost", type: "button", text: "ביטול", onclick: () => openView(p.id) }), err));
  overlay.textContent = ""; overlay.append(panel); overlay.hidden = false; panel.querySelector("#e-title").focus();
}
function openComment(p) {
  const err = el("div", { class: "small", role: "status" });
  const ta = el("textarea", { id: "c-text", placeholder: p ? "מה לתקן, מה לשנות, רעיון…" : "כל דבר: רעיון לפוסט, משהו לשנות, שאלה…" });
  const back = () => (p ? openView(p.id) : closePanel());
  const panel = el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "הערה ל-Claude" },
    el("button", { class: "btn close", type: "button", onclick: back, text: "חזרה" }),
    el("h2", { text: p ? "הערה ל-Claude על הפוסט" : "הערה כללית ל-Claude" }),
    p ? el("div", { class: "small", text: p.title }) : null,
    el("div", { class: "field" }, el("label", { for: "c-text", text: "ההערה" }), ta),
    el("div", { class: "small", text: "ההערה נשמרת בגיליון, בלשונית \u201cהערות לClaude\u201d, ואני עוברת עליהן בתחילת כל שיחה על הברדקיה." }));
  const send = el("button", { class: "btn primary", type: "button", text: "שליחה", onclick: async () => {
    if (!ta.value.trim()) { err.textContent = "ההערה ריקה."; return; }
    send.disabled = true; err.textContent = "שולחת…";
    try { await api("/api/comment", { id: p ? p.id : "", text: ta.value }); err.textContent = "✓ נשלח. תודה!"; ta.value = ""; if (p) { await loadSheet(); } setTimeout(back, 900); }
    catch (e) { send.disabled = false; err.textContent = e.message === "auth" ? "הכניסה פגה. בקשי מהבוט קישור חדש (\u201cכניסה ללוח\u201d)." : "השליחה לא הצליחה. נסי שוב בעוד רגע."; }
  } });
  panel.append(el("div", { class: "foot" }, send, err));
  overlay.textContent = ""; overlay.append(panel); overlay.hidden = false; ta.focus();
}


const SHEET_ID = "13y7oKy9j0hutShF95lLgHiRH_fPWYWE3nd7xdf9X7Eg";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
function toIso(f) { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((f || "").trim()); return m ? m[3] + "-" + pad(+m[2]) + "-" + pad(+m[1]) : ""; }
async function loadSheet() {
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent("פוסטים") + "&t=" + Date.now();
  try {
    const txt = await (await fetch(url, { cache: "no-store" })).text();
    const json = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    const cell = (r, i) => { const c = r.c[i]; return c ? (c.f != null ? String(c.f) : (c.v == null ? "" : String(c.v))) : ""; };
    posts = (json.table.rows || []).map((r, n) => ({
      row: n + 2, id: cell(r, 0) || "row" + n, date: toIso(cell(r, 1)), time: cell(r, 2), format: cell(r, 3), pillar: cell(r, 4), status: cell(r, 5) || "רעיון",
      title: cell(r, 6), caption: cell(r, 7), notes: cell(r, 8), images: cell(r, 9).split(/[\s,]+/).filter(u => /^https?:\/\//.test(u)),
    })).filter(p => p.title || p.date);
    const now = new Date();
    document.getElementById("sourceNote").textContent = "מתעדכן מהגיליון. נטען ב-" + pad(now.getHours()) + ":" + pad(now.getMinutes());
    document.getElementById("notice").hidden = true;
    render();
  } catch (e) {
    showNotice("לא הצלחנו לטעון את הגיליון כרגע. בודקים את החיבור ולוחצים “רענון”.");
  }
}
